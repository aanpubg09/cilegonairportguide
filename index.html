<title>Cilegon Airport Guide - Kalkulator Admin</title>
<style>
:root {
 --primary:#008c82;
 --dark:#00675f;
}
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
 margin:0;
 padding:18px;
 background:linear-gradient(135deg,#e1f5f2,#ffffff);
 color:#222;
}
.app{max-width:520px;margin:auto}
.card{
 background:white;
 border-radius:24px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 15px 40px rgba(0,100,90,.15);
}
.brand{
 display:flex;
 align-items:center;
 gap:14px;
}
.logo{
 width:65px;
 height:65px;
 border-radius:18px;
 object-fit:cover;
}
h1{font-size:21px;margin:0;color:var(--primary)}
.sub{margin-top:5px;color:#777;font-size:13px}
label{
 display:block;
 margin-top:14px;
 margin-bottom:7px;
 font-weight:700;
 font-size:14px;
}
input{
 width:100%;
 height:52px;
 padding:12px;
 border-radius:15px;
 border:1px solid #ddd;
 font-size:16px;
}
button{
 width:100%;
 height:55px;
 margin-top:15px;
 border:0;
 border-radius:17px;
 background:linear-gradient(135deg,var(--primary),var(--dark));
 color:white;
 font-size:16px;
 font-weight:bold;
}
.result{
 display:none;
}
.unit{
 background:#eef8f6;
 border-radius:18px;
 padding:15px;
 margin-top:12px;
}
.price{
 font-size:24px;
 font-weight:bold;
 color:var(--primary);
}
.copy{
 background:#111;
}
</style>

</div>

<div class="card">

<label>Lokasi Jemput</label>
<input id="lokasi" placeholder="Masukkan lokasi jemput">

<label>Tujuan</label>
<input id="tujuan" placeholder="Masukkan tujuan">

<label>Jarak (KM)</label>
<input id="jarak" type="number" placeholder="Masukkan jarak">

<label>Tarif Tol</label>
<input id="tol" type="number" placeholder="Masukkan tarif tol">

<button onclick="hitung()">Hitung Harga</button>

</div>


<div class="card result" id="hasilBox">

<h3>Estimasi Harga</h3>

<div class="unit">
<b>XL7</b><br>
Maksimal 7 orang<br>
<span class="price" id="xl7"></span>
</div>

<div class="unit">
<b>Brio</b><br>
Maksimal 3 orang<br>
<span class="price" id="brio"></span>
</div>

<button class="copy" onclick="copyHasil()">Copy Hasil Customer</button>

</div>

</div>

<script>
let pesan="";

function bulat(x){
 return Math.round(x/10000)*10000;
}

function rupiah(x){
 return "Rp"+x.toLocaleString("id-ID");
}

function hitung(){
 let lokasi=document.getElementById("lokasi").value;
 let tujuan=document.getElementById("tujuan").value;
 let jarak=Number(document.getElementById("jarak").value);
 let tol=Number(document.getElementById("tol").value);

 if(!lokasi || !tujuan || !jarak || !tol){
   alert("Mohon isi semua data terlebih dahulu");
   return;
 }

 let xl7=bulat((jarak*8710)+tol);
 let brio=bulat((jarak*7096)+tol);

 document.getElementById("xl7").innerHTML=rupiah(xl7);
 document.getElementById("brio").innerHTML=rupiah(brio);

 pesan=`CILEGON AIRPORT GUIDE

Lokasi Jemput: ${lokasi}
Tujuan: ${tujuan}

Pilihan Unit:
- XL7 (maksimal 7 orang): ${rupiah(xl7)}
- Brio (maksimal 3 orang): ${rupiah(brio)}

Harga sudah termasuk BBM dan Tol ya kak, jadi tidak ada biaya tambahan lagi 😊❤️`;

 document.getElementById("hasilBox").style.display="block";
}

function copyHasil(){
 navigator.clipboard.writeText(pesan);
 alert("Hasil berhasil dicopy");
}
</script>

</body>
</html>
